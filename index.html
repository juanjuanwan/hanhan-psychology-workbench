function phaseOf(i){return i<=8?0:i<=14?1:i<=26?2:i<=34?3:4}function goalOf(i){if(i<=14)return desc[i-1]||'建立科学推理与证据评价能力。';if(i<=26)return '完成核心问题、主要理论、代表研究、证据与争议、跨领域连接五项产出。';if(i<=34)return '围绕自我与关系方向精读、做概念卡并形成专题知识地图。';return i===35?'确定问题，建立证据表并完成综述提纲。':'完成 3000 字综述，明确证据、争议与应用边界。'}

let S=load(),active='today',filter='全部',editing=null,selectedWeek=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){return defaults()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function add(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function today(){let d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)}function currentWeek(){let a=new Date(S.settings.start+'T00:00:00'),b=new Date(today()+'T00:00:00'),n=Math.floor((b-a)/604800000)+1;return Math.max(1,Math.min(36,n))}function currentDay(){let a=new Date(S.settings.start+'T00:00:00'),b=new Date(today()+'T00:00:00'),n=Math.floor((b-a)/86400000);if(n<0)return 1;return Math.min(7,n%7+1)}function plan(i){let title=titles[i-1];if(i>=27&&i<=34)title=S.settings.track+'：'+title;return{title,phase:phaseOf(i),goal:goalOf(i)}}function weekDone(i){return Array.from({length:7},(_,d)=>S.done[i+'-d'+(d+1)]).filter(Boolean).length}function totalMinutes(i){return Array.from({length:7},(_,d)=>(+S.minutes[i+'-d'+(d+1)]||0)).reduce((a,b)=>a+b,0)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

]}
const navs=[['today','今日学习'],['road','36 周路线'],['map','知识地图'],['review','复习队列'],['outcome','成果与复盘']];function buildNav(){let h=navs.map(n=>`<button class="${active===n[0]?'on':''}" onclick="show('${n[0]}')">${n[1]}</button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('bottom').innerHTML=h}function show(id){active=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));buildNav();render()}function render(){buildNav();renderToday();renderRoad();renderMap();renderReview();renderOutcome()}
function renderToday(){let w=selectedWeek||currentWeek(),d=w===currentWeek()?currentDay():1,p=plan(w),days=dailyPlan(w),done=weekDone(w),pct=Math.round(done/7*100),focus=days[d-1];let cards=days.map((x,i)=>{let n=i+1,k=w+'-d'+n,yes=S.done[k],date=add(S.settings.start,(w-1)*7+i);return`<article class="daycard ${yes?'done':''} ${n===d?'todayDay':''}"><div><span class="daytag">第 ${n} 天</span><small>${date}</small></div><div><h3>${x.title}</h3><p>${x.detail} · 建议 ${x.min} 分钟</p></div><div class="dayactions">${x.url?`<a class="resourcebtn" target="_blank" rel="noopener" href="${x.url}">${x.label} ↗</a>`:''}<input aria-label="实际分钟" type="number" min="0" value="${S.minutes[k]||0}" onchange="setMin('${k}',this.value)"><span>分钟</span><button class="check" onclick="toggle('${k}')">${yes?'✓':'○'}</button></div></article>`}).join('');document.getElementById('today').innerHTML=`<div class="top"><div><p class="eyebrow">第 ${w} 周 · 第 ${d} 天 · ${phases[p.phase].name}</p><h1>${p.title}</h1><p class="sub">${phases[p.phase].range}</p></div>${selectedWeek?'<button class="btn" onclick="selectedWeek=null;render()">返回当前周</button>':'<button class="btn" onclick="openSettings()">学习设置</button>'}</div><div class="hero"><div><span class="phase">本周目标</span><h2>每天打开，只做当天这一项</h2><p>${p.goal}</p></div><div class="ring" style="--p:${pct}"><div><strong>${pct}%</strong><span>本周进度</span></div></div></div><section class="todayFocus"><span class="eyebrow">${selectedWeek?'所选周的第1天':'今天的唯一主任务'}</span><h2>${focus.title}</h2><p>${focus.detail}</p>${focus.url?`<a class="resourcebtn" target="_blank" rel="noopener" href="${focus.url}">${focus.label} ↗</a>`:'<button class="btn primary" onclick="show(\'map\')">进入工作台完成</button>'}</section><div class="sectionhead"><div><p class="eyebrow">每周 ${S.settings.hours} 小时 · 七天自动排好</p><h2>本周每日清单</h2></div><span>${done} / 7</span></div><div class="daylist">${cards}</div><div class="warn">英文网页可使用 Chrome 地址栏右侧的“翻译”按钮。学习心理障碍相关内容不能替代专业评估，也不能用于给自己或他人下诊断。</div>`}
function toggle(k){S.done[k]=!S.done[k];save();render()}function setMin(k,v){S.minutes[k]=Math.max(0,+v||0);save();renderOutcome()}
function renderRoad(){let out=`<div class="top"><div><p class="eyebrow">完整学习地图</p><h1>36 周路线</h1><p class="sub">点击任意一周，即可查看那一周的7天资源与任务</p></div></div>`;phases.forEach((ph,pi)=>{let ws=[];for(let i=1;i<=36;i++)if(phaseOf(i)===pi){let p=plan(i),n=weekDone(i),r=coursePlan[i-1];ws.push(`<article class="week ${i===currentWeek()?'now':''}" role="button" tabindex="0" onclick="openWeek(${i})" onkeydown="if(event.key==='Enter')openWeek(${i})"><b>第 ${i} 周</b><div><h3>${p.title}</h3><p>${r.a} · ${r.v}</p></div><span class="dots">${[0,1,2,3,4,5,6].map(x=>`<span class="${x<n?'filled':''}">●</span>`).join('')}</span></article>`)}out+=`<section class="phaseBlock"><div class="phaseTitle"><h2>${ph.name}</h2><span>${ph.range}</span></div><div class="weeks">${ws.join('')}</div></section>`});document.getElementById('road').innerHTML=out}function openWeek(i){selectedWeek=i;show('today');window.scrollTo(0,0)}
function renderMap(){let q=(document.getElementById('mapSearch')||{}).value||'', chips=['全部',...modules].map(m=>`<button class="chip ${filter===m?'on':''}" onclick="setFilter('${m}')">${m}</button>`).join('');let list=S.concepts.filter(c=>(filter==='全部'||c.module===filter)&&(!q||JSON.stringify(c).toLowerCase().includes(q.toLowerCase()))).map(c=>`<article class="concept"><header><div><h3>${esc(c.name)}</h3><span class="badge">${esc(c.module)}</span></div><button class="btn small" onclick="editConcept('${c.id}')">编辑</button></header><dl><dt>定义</dt><dd>${esc(c.definition)}</dd><dt>机制</dt><dd>${esc(c.mechanism||'待补充')}</dd><dt>证据</dt><dd>${esc(c.evidence||'待补充')}</dd><dt>边界</dt><dd>${esc(c.boundary||'待补充')}</dd><dt>连接</dt><dd>${esc(c.related||'待补充')}</dd></dl><footer><span>下次复习：${c.next||'尚未安排'}</span><button class="btn small danger" onclick="deleteConcept('${c.id}')">删除</button></footer></article>`).join('');document.getElementById('map').innerHTML=`<div class="top"><div><p class="eyebrow">把知识连成网络</p><h1>知识地图</h1><p class="sub">概念、机制、证据、边界与连接</p></div><button class="btn primary" onclick="newConcept()">＋ 新建概念卡</button></div><div class="tools"><input id="mapSearch" placeholder="搜索概念、证据或例子" value="${esc(q)}" oninput="renderMap()"></div><div class="modules">${chips}</div><div class="cards">${list||'<div class="empty">还没有符合条件的概念卡</div>'}</div>`}function setFilter(v){filter=v;renderMap()}
function newConcept(){editing=null;document.getElementById('conceptTitle').textContent='新建概念卡';fillConcept({module:modules[0]});document.getElementById('conceptModal').classList.add('on')}function editConcept(id){editing=id;document.getElementById('conceptTitle').textContent='编辑概念卡';fillConcept(S.concepts.find(c=>c.id===id));document.getElementById('conceptModal').classList.add('on')}function fillConcept(c){document.getElementById('cModule').innerHTML=modules.map(m=>`<option>${m}</option>`).join('');['Name','Module','Definition','Phenomenon','Mechanism','Evidence','Boundary','Misconception','Related','Example'].forEach(k=>document.getElementById('c'+k).value=c[k.toLowerCase()]||'')}function saveConcept(){let name=cName.value.trim();if(!name)return alert('请先填写概念名称');let c={id:editing||'c'+Date.now(),name,module:cModule.value,definition:cDefinition.value,phenomenon:cPhenomenon.value,mechanism:cMechanism.value,evidence:cEvidence.value,boundary:cBoundary.value,misconception:cMisconception.value,related:cRelated.value,example:cExample.value,stage:editing?(S.concepts.find(x=>x.id===editing).stage||0):0,next:editing?(S.concepts.find(x=>x.id===editing).next):add(today(),1)};if(editing)S.concepts=S.concepts.map(x=>x.id===editing?c:x);else S.concepts.push(c);save();closeModal('conceptModal');render()}function deleteConcept(id){if(confirm('删除这张概念卡？')){S.concepts=S.concepts.filter(c=>c.id!==id);save();render()}}
function renderReview(){let now=today(),due=S.concepts.filter(c=>c.next&&c.next<=now),future=S.concepts.filter(c=>!c.next||c.next>now);let cards=due.map(c=>`<article class="reviewCard"><span class="badge">${esc(c.module)}</span><h3>${esc(c.name)}</h3><div class="answer"><b>先闭卷回答：</b>它是什么？解释什么？证据是什么？边界在哪里？<br><br><b>参考：</b>${esc(c.definition)}</div><div class="rates"><button class="btn danger" onclick="rate('${c.id}','forget')">忘记</button><button class="btn" onclick="rate('${c.id}','unclear')">模糊</button><button class="btn primary" onclick="rate('${c.id}','master')">掌握</button></div></article>`).join('');document.getElementById('review').innerHTML=`<div class="top"><div><p class="eyebrow">1 · 3 · 7 · 14 · 30 天</p><h1>复习队列</h1><p class="sub">根据你的自评自动安排下一次复习</p></div></div><div class="stats"><div class="stat"><strong>${due.length}</strong><span>今日到期</span></div><div class="stat"><strong>${future.length}</strong><span>未来复习</span></div><div class="stat"><strong>${S.concepts.length}</strong><span>概念卡</span></div><div class="stat"><strong>${S.concepts.filter(c=>(c.stage||0)>=5).length}</strong><span>完成一轮</span></div></div>${cards||'<div class="empty">今天没有到期复习。新增概念卡后会自动安排。</div>'}`}
function rate(id,r){let c=S.concepts.find(x=>x.id===id),st=c.stage||0,ints=[1,3,7,14,30];if(r==='forget')st=0;else if(r==='unclear')st=Math.max(0,st-1);else st=Math.min(5,st+1);c.stage=st;c.next=add(today(),st>=5?30:ints[st]);save();render()}
function renderOutcome(){let full=0,minutes=0;for(let i=1;i<=36;i++){if(weekDone(i)===7)full++;minutes+=totalMinutes(i)}let progress=Math.round(full/36*100),moduleData=modules.map(m=>{let cs=S.concepts.filter(c=>c.module===m),v=cs.length?Math.round(cs.reduce((n,c)=>n+(c.stage||0),0)/(cs.length*5)*100):0;return[m,v]}),bars=moduleData.map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join(''),heat=Array.from({length:36},(_,i)=>{let m=totalMinutes(i+1),l=m>300?3:m>120?2:m>0?1:0;return`<span class="l${l}" title="第${i+1}周：${m}分钟">${i+1}</span>`}).join(''),history=S.reflections.slice().reverse().map(r=>`<article><small>第 ${r.week} 周 · ${r.date}</small><p>${esc(r.text)}</p></article>`).join('');document.getElementById('outcome').innerHTML=`<div class="top"><div><p class="eyebrow">只计算真实打卡</p><h1>成果与复盘</h1><p class="sub">看见进度，也看见薄弱环节</p></div></div><div class="stats"><div class="stat"><strong>${progress}%</strong><span>总进度</span></div><div class="stat"><strong>${full}</strong><span>完整完成周</span></div><div class="stat"><strong>${Math.round(minutes/60)}</strong><span>累计小时</span></div><div class="stat"><strong>${S.concepts.length}</strong><span>概念卡</span></div></div><div class="grid2"><section class="panel"><h2>模块掌握度</h2><div class="bars">${bars}</div></section><section class="panel"><h2>36 周投入热力图</h2><div class="heat">${heat}</div><p class="sub">颜色越深，记录的学习时间越长。</p></section></div><div class="grid2" style="margin-top:14px"><section class="panel"><h2>当前薄弱模块</h2><p>${moduleData.filter(x=>x[1]<40).slice(0,4).map(x=>x[0]).join('、')||'暂无明显薄弱模块'}</p><p class="sub">依据概念卡复习阶段计算；没有卡片的模块也会被列出。</p></section><section class="panel reflection"><h2>第 ${currentWeek()} 周复盘</h2><textarea id="reflectionText" placeholder="学到了什么？最难的概念？证据如何支持结论？与旧知识有什么连接？下周如何调整？"></textarea><button class="btn primary" style="margin-top:8px" onclick="saveReflection()">保存本周复盘</button><div class="history">${history}</div></section></div>`}function saveReflection(){let text=reflectionText.value.trim();if(!text)return;S.reflections.push({week:currentWeek(),date:today(),text});save();renderOutcome()}
function openSettings(){sDate.value=S.settings.start;sHours.value=S.settings.hours;sTrack.value=S.settings.track;settingsModal.classList.add('on')}function saveSettings(){S.settings={start:sDate.value||'2026-08-31',hours:Math.max(1,+sHours.value||6),track:sTrack.value.trim()||'自我与关系'};save();closeModal('settingsModal');render()}function closeModal(id){document.getElementById(id).classList.remove('on')}function clearDemo(){S.concepts=S.concepts.filter(c=>!c.demo);save();closeModal('settingsModal');render()}function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='心理学学习工作台备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.concepts))throw 0;S=d;save();closeModal('settingsModal');render();alert('导入成功')}catch(e){alert('文件格式不正确')}};r.readAsText(f)}
render();
</script></body></html>
